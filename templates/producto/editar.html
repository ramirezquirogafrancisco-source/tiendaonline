{% extends 'layout.html' %}

{% block content %}
<h2>Editar Producto #{{ producto.ID_producto }}</h2>
<form action="{{ url_for('producto.editar', id=producto.ID_producto) }}" method="POST" class="card p-4 shadow-sm bg-white">
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre del Producto</label>
        <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
    </div>
    <div class="mb-3">
        <label for="precio" class="form-label">Precio</label>
        <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio }}" required>
    </div>
    <div class="mb-3">
        <label for="stock" class="form-label">Stock</label>
        <input type="number" name="stock" class="form-control" value="{{ producto.stock }}" required>
    </div>
    <div>
        <button type="submit" class="btn btn-warning">Actualizar</button>
        <a href="{{ url_for('producto.index') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
