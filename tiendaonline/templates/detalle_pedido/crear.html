
{% extends 'layout.html' %}

{% block title %}Agregar Producto a Pedido{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="mb-4">
                <a href="{{ url_for('detalle_pedidos.listar_detalles') }}"
                   class="text-decoration-none text-muted small">
                    <i class="bi bi-arrow-left"></i> Volver a la lista
                </a>
                <h2 class="fw-bold mt-2">Registrar Detalle de Pedido</h2>
                <p class="text-muted small">
                    Asigna un producto a un pedido existente.
                </p>
            </div>

            <div class="custom-card p-4">
                <form action="{{ url_for('detalle_pedidos.crear_detalle') }}"
                      method="POST">

                    <div class="mb-3">
                        <label for="id_pedido" class="form-label">Pedido</label>
                        <select class="form-select" id="id_pedido"
                                name="id_pedido" required>
                            <option value="" disabled selected>
                                -- Selecciona un pedido --
                            </option>
                            {% for ped in pedidos %}
                            <option value="{{ ped['id_pedido'] }}">
                                Pedido #{{ ped['id_pedido'] }}
                                (Cliente ID: {{ ped['ID_cliente'] }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="ID_producto" class="form-label">Producto</label>
                        <select class="form-select" id="ID_producto"
                                name="ID_producto" required>
                            <option value="" disabled selected>
                                -- Selecciona un producto --
                            </option>
                            {% for prod in productos %}
                            <option value="{{ prod['ID_producto'] }}">
                                #{{ prod['ID_producto'] }} - {{ prod['nombre'] }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="precio_unitario" class="form-label">
                            Precio unitario ($)
                        </label>
                        <input type="number" step="0.01" min="0"
                               class="form-control" id="precio_unitario"
                               name="precio_unitario" required>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('detalle_pedidos.listar_detalles') }}"
                           class="btn btn-cream-outline rounded-pill px-4">
                            Cancelar
                        </a>
                        <button type="submit"
                                class="btn btn-cream-accent rounded-pill px-4 fw-bold">
                            Guardar detalle
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
