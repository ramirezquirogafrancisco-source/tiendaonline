{% extends 'layout.html' %}

{% block title %}Agregar Producto a Pedido{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            
            <div class="mb-4">
                <a href="{{ url_for('detalle_pedidos.listar_detalles') }}" class="text-decoration-none text-muted small d-inline-flex align-items-center gap-1 mb-2">
                    <i class="bi bi-arrow-left"></i> Volver a la lista
                </a>
                <h2 class="fw-bold m-0" style="color: var(--text-dark);">Registrar Detalle de Pedido</h2>
                <p class="text-muted small">Asigna un producto y su precio a una orden existente.</p>
            </div>

            <div class="custom-card p-4">
                <form action="{{ url_for('detalle_pedidos.crear_detalle') }}" method="POST">
                    
                    <!-- Selección de Pedido -->
                    <div class="mb-3">
                        <label for="id_pedido" class="form-label fw-semibold small" style="color: var(--text-dark);">Pedido</label>
                        <select class="form-select" id="id_pedido" name="id_pedido" required style="border-color: var(--border-color);">
                            <option value="" disabled selected>-- Selecciona un Pedido --</option>
                            {% if pedidos %}
                                {% for ped in pedidos %}
                                    <option value="{{ ped.id_pedido }}">
                                        Pedido #{{ ped.id_pedido }} (Cliente ID: {{ ped.ID_cliente }})
                                    </option>
                                {% endfor %}
                            {% endif %}
                        </select>
                    </div>

                    <!-- Selección de Producto -->
                    <div class="mb-3">
                        <label for="ID_producto" class="form-label fw-semibold small" style="color: var(--text-dark);">Producto</label>
                        <select class="form-select" id="ID_producto" name="ID_producto" required style="border-color: var(--border-color);">
                            <option value="" disabled selected>-- Selecciona un Producto --</option>
                            {% if productos %}
                                {% for prod in productos %}
                                    <option value="{{ prod.ID_Producto if prod.ID_Producto else prod.id }}">
                                        #{{ prod.ID_Producto if prod.ID_Producto else prod.id }} - {{ prod.Nombre if prod.Nombre else prod.nombre }}
                                    </option>
                                {% endfor %}
                            {% endif %}
                        </select>
                    </div>

                    <!-- Precio Unitario -->
                    <div class="mb-4">
                        <label for="precio_unitario" class="form-label fw-semibold small" style="color: var(--text-dark);">Precio Unitario ($)</label>
                        <input type="number" step="0.01" class="form-control" id="precio_unitario" name="precio_unitario" placeholder="Ej: 1000.00" required style="border-color: var(--border-color);">
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('detalle_pedidos.listar_detalles') }}" class="btn btn-cream-outline rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn btn-cream-accent rounded-pill px-4 fw-bold shadow-sm">Guardar Detalle</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
