
{% extends 'layout.html' %}

{% block title %}Editar Detalle de Pedido{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="custom-card p-4">
                <h2 class="fw-bold mb-4">Editar detalle de pedido</h2>

                {% if detalle %}
                <form action="{{ url_for('detalle_pedidos.editar_detalle', id_detalle=detalle['id_detalle']) }}"
                      method="POST">
                    <div class="mb-3">
                        <label for="id_pedido" class="form-label">Pedido</label>
                        <select class="form-select" id="id_pedido"
                                name="id_pedido" required>
                            {% for ped in pedidos %}
                            <option value="{{ ped['id_pedido'] }}"
                                {% if ped['id_pedido'] == detalle['id_pedido'] %}
                                    selected
                                {% endif %}>
                                Pedido #{{ ped['id_pedido'] }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="ID_producto" class="form-label">Producto</label>
                        <select class="form-select" id="ID_producto"
                                name="ID_producto" required>
                            {% for prod in productos %}
                            <option value="{{ prod['ID_producto'] }}"
                                {% if prod['ID_producto'] == detalle['ID_producto'] %}
                                    selected
                                {% endif %}>
                                {{ prod['nombre'] }} (ID: {{ prod['ID_producto'] }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="precio_unitario" class="form-label">
                            Precio unitario ($)
                        </label>
                        <input type="number" step="0.01" min="0"
                               class="form-control" id="precio_unitario"
                               name="precio_unitario"
                               value="{{ detalle['precio_unitario'] }}" required>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('detalle_pedidos.listar_detalles') }}"
                           class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-dark">
                            Guardar cambios
                        </button>
                    </div>
                </form>
                {% else %}
                <p class="text-danger">No se encontró el detalle solicitado.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
