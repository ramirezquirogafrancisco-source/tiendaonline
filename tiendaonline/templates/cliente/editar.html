{% extends 'layout.html' %}

{% block title %}Editar Cliente{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            
            <!-- ENCABEZADO -->
            <div class="mb-4">
                <a href="{{ url_for('clientes.listar_clientes') }}" class="text-decoration-none text-muted small d-inline-flex align-items-center gap-1 mb-2">
                    <i class="bi bi-arrow-left"></i> Volver a la lista
                </a>
                <h2 class="fw-bold m-0" style="color: var(--text-dark);">Editar Cliente</h2>
                <p class="text-muted small">Modifica la información del cliente #{{ cliente.ID_Cliente }}.</p>
            </div>

            <!-- FORMULARIO DENTRO DE CARD -->
            <div class="custom-card p-4">
                <form action="{{ url_for('clientes.editar_cliente', id_cliente=cliente.ID_Cliente) }}" method="POST">
                    
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-semibold small" style="color: var(--text-dark);">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ cliente.Nombre }}" required style="border-color: var(--border-color);">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small" style="color: var(--text-dark);">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ cliente.Email }}" required style="border-color: var(--border-color);">
                    </div>

                    <div class="mb-4">
                        <label for="telefono" class="form-label fw-semibold small" style="color: var(--text-dark);">Teléfono</label>
                        <input type="text" class="form-control" id="telefono" name="telefono" value="{{ cliente.Telefono }}" style="border-color: var(--border-color);">
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('clientes.listar_clientes') }}" class="btn btn-cream-outline rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn btn-cream-accent rounded-pill px-4 fw-bold shadow-sm">Actualizar Cambios</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
