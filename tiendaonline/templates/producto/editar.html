
{% extends 'layout.html' %}

{% block title %}Editar Producto - Tienda Los Insuficientes{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <a href="{{ url_for('producto.index') }}"
               class="text-decoration-none text-secondary small">
                <i class="bi bi-arrow-left"></i> Volver a productos
            </a>

            <div class="card custom-card mt-3">
                <div class="card-body p-4">
                    <h3 class="fw-bold text-dark mb-4">Modificar Producto</h3>

                    {% if producto %}
                    <form action="{{ url_for('producto.editar', id=producto['ID_producto']) }}"
                          method="POST">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del producto</label>
                            <input type="text" class="form-control" id="nombre"
                                   name="nombre" value="{{ producto['nombre'] }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="precio" class="form-label">Precio</label>
                            <input type="number" step="0.01" min="0"
                                   class="form-control" id="precio" name="precio"
                                   value="{{ producto['precio'] }}" required>
                        </div>

                        <div class="mb-4">
                            <label for="stock" class="form-label">Stock</label>
                            <input type="number" min="0" class="form-control"
                                   id="stock" name="stock"
                                   value="{{ producto['stock'] }}" required>
                        </div>

                        <button type="submit" class="btn btn-dark rounded-pill py-2 w-100">
                            Actualizar producto
                        </button>
                    </form>
                    {% else %}
                    <p class="text-danger">No se encontró el producto solicitado.</p>
                    <a href="{{ url_for('producto.index') }}" class="btn btn-secondary">
                        Volver al listado
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
