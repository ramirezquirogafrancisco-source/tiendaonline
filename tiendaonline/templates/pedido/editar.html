
{% extends 'layout.html' %}

{% block title %}Editar Pedido{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <a href="{{ url_for('pedidos.listar_pedidos') }}"
               class="text-decoration-none text-muted">
                <i class="bi bi-arrow-left"></i> Volver a pedidos
            </a>

            <div class="custom-card p-4 mt-3">
                <h2 class="fw-bold mb-4">
                    Editar pedido #{{ pedido['id_pedido'] }}
                </h2>

                {% if pedido %}
                <form action="{{ url_for('pedidos.editar_pedido', id_pedido=pedido['id_pedido']) }}"
                      method="POST">
                    <div class="mb-3">
                        <label for="id_cliente" class="form-label">Cliente</label>
                        <select class="form-select" id="id_cliente"
                                name="id_cliente" required>
                            {% for cliente in clientes %}
                            <option value="{{ cliente['ID_Cliente'] }}"
                                {% if cliente['ID_Cliente'] == pedido['ID_cliente'] %}
                                    selected
                                {% endif %}>
                                {{ cliente['Nombre'] }}
                                (ID: {{ cliente['ID_Cliente'] }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <a href="{{ url_for('pedidos.listar_pedidos') }}"
                           class="btn btn-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-dark">
                            Guardar cambios
                        </button>
                    </div>
                </form>
                {% else %}
                <p class="text-danger">No se encontró el pedido.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
